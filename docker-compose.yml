services:
  white-rabbit:
    build:
      context: .
      dockerfile: src/Nordray.WhiteRabbit.Web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - WhiteRabbit_Database__ConnectionString=Data Source=/data/white-rabbit.db
      - WhiteRabbit_Mailjet__ApiKey=${MAILJET_API_KEY:-}
      - WhiteRabbit_Mailjet__SecretKey=${MAILJET_SECRET_KEY:-}
      - WhiteRabbit_Mailjet__FromEmail=${MAILJET_FROM_EMAIL:-noreply@example.com}
      - WhiteRabbit_DataProtection__EncryptionKey=${WHITE_RABBIT_DATA_PROTECTION_KEY:?WHITE_RABBIT_DATA_PROTECTION_KEY must be set (openssl rand -base64 32)}
      - WhiteRabbit_Access__AllowedEmails__0=${WHITE_RABBIT_ALLOWED_EMAIL:?WHITE_RABBIT_ALLOWED_EMAIL must be set (the address you sign in with)}
      # Optional: everyone at one domain. More addresses or domains need more lines here (…__1, …__2).
      - WhiteRabbit_Access__AllowedDomains__0=${WHITE_RABBIT_ALLOWED_DOMAIN:-}
    volumes:
      - ./data/white-rabbit:/data
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
