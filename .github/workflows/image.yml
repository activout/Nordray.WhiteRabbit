name: Server image

# Publishes the generic White Rabbit server image to ghcr.io/activout/nordray-whiterabbit:
#   - every push to main: :sha-<commit> and :main
#   - every v* tag:       :<tag> (e.g. :v0.1.0) and :latest
# Pull requests build the image without pushing it.
# Operators deploy a pinned digest, never a moving tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["cli/**", "**.md"]
  pull_request:
    paths-ignore: ["cli/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}

env:
  IMAGE: ghcr.io/activout/nordray-whiterabbit

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build
        run: |
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.licenses=MIT" \
            --label "org.opencontainers.image.description=White Rabbit: a capability-scoped proxy for the bunny.net API" \
            -f src/Nordray.WhiteRabbit.Web/Dockerfile \
            -t "$IMAGE:sha-$GITHUB_SHA" .

      - name: Push
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tags=("sha-$GITHUB_SHA")
          if [ "$GITHUB_REF_TYPE" = tag ]; then tags+=("$GITHUB_REF_NAME" latest); else tags+=(main); fi
          for tag in "${tags[@]}"; do
            [ "$tag" = "sha-$GITHUB_SHA" ] || docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA")
          {
            echo "### Published"
            echo
            echo "Pin this in a deployment:"
            echo
            echo "    $digest"
            echo
            echo "Tags: ${tags[*]}"
          } >> "$GITHUB_STEP_SUMMARY"
