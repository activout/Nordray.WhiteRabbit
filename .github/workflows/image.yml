name: Server image

# Publishes the generic White Rabbit server image to ghcr.io/activout/nordray-whiterabbit:
#   - every push to main: :sha-<commit> and :main
#   - every v* tag:       :<tag> (e.g. :v0.1.0) and :latest
# Pull requests are validated by pr.yml.
# Operators deploy a pinned digest, never a moving tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["cli/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}

env:
  IMAGE: ghcr.io/activout/nordray-whiterabbit

jobs:
  test:
    uses: ./.github/workflows/server-test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.licenses=MIT" \
            --label "org.opencontainers.image.description=White Rabbit: a capability-scoped proxy for the bunny.net API" \
            -f src/Nordray.WhiteRabbit.Web/Dockerfile \
            -t "$IMAGE:sha-$GITHUB_SHA" .

      - name: Push
        id: push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tags=("sha-$GITHUB_SHA")
          if [ "$GITHUB_REF_TYPE" = tag ]; then tags+=("$GITHUB_REF_NAME" latest); else tags+=(main); fi
          for tag in "${tags[@]}"; do
            [ "$tag" = "sha-$GITHUB_SHA" ] || docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          digest_ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA")
          digest="${digest_ref#*@}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Published"
            echo
            echo "Pin this in a deployment:"
            echo
            echo "    $digest_ref"
            echo
            echo "Tags: ${tags[*]}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest published image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
